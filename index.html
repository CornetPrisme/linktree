<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/css/style.css" rel="stylesheet">
    <title>Linktree</title>
</head>

<body>
    <div id="haut_de_page">
        <img src="/img/photo01.jpg"/>
        <p>Victor Blain</p>
    </div>

    <div id="liens">
        <button class="lien-bouton" onclick="location.href='https://github.com/CornetPrisme'">
            <img src="/icons/icon-github.svg" alt="Github icon">
            <span>Github</span>
        </button>

        <button class="lien-bouton" onclick="location.href='mailto:victor.blain2006@gmail.com'">
            <img src="/icons/icon-mail.svg" alt="Mail icon">
            <span>Mail</span>
        </button>

        <button class="lien-bouton" onclick="location.href='https://www.instagram.com/_v_blain_/'">
            <img src="/icons/icon-instagram.svg" alt="Instagram icon">
            <span>Instagram</span>
        </button>

        <button class="lien-bouton" onclick="location.href='https://cloud.vblain.fr'">
            <img src="/icons/icon-cloud.svg" alt="Cloud icon">
            <span>Cloud</span>
        </button>

        <button class="lien-bouton" onclick="location.href='https://insash.org/'">
            <img src="/icons/icon-cpu.svg" alt="INSA.sh icon">
            <span>INSA.sh</span>
        </button>

        <button class="lien-bouton" onclick="location.href='https://github.com/Valrobotik'">
            <img src="/icons/icon-robot.svg" alt="Valrobotik icon">
            <span>Valrobotik</span>
        </button>

        <button class="lien-bouton" onclick="location.href='https://worldathletics.org/athletes/france/victor-blain-15160673'">
            <img src="/icons/icon-shoe.svg" alt="World Athletics icon">
            <span>World Athletics</span>
        </button>
</div>


    </div>
</body>

</html>
